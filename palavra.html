<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rosa:#c4396b;--rosa-l:#e8688a;--rosa-dim:rgba(196,57,107,.08);
  --terra:#8c3a1a;
  --creme:#fff5f7;
  --border:rgba(196,90,30,.13);
  --text:#2e1a0e;--text-dim:rgba(46,26,14,.48);
  --green:#2a7a60;--green-dim:rgba(42,122,96,.08);
  --gold:#8c5a00;--gold-dim:rgba(139,90,0,.08);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(196,57,107,.1) 0%,rgba(196,57,107,.04) 35%,transparent 65%),
    radial-gradient(ellipse at 15% 90%,rgba(196,57,107,.07) 0%,transparent 50%),
    #fff5f7;}

.section-wrap{max-width:560px;margin:0 auto;padding:28px 20px 100px}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin-bottom:8px;text-align:center}
.section-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:600;color:var(--text);margin-bottom:6px;text-align:center}
.section-sub{font-family:'Crimson Pro',Georgia,serif;font-size:.95rem;color:var(--text-dim);font-style:italic;margin-bottom:22px;line-height:1.6;text-align:center}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:var(--text-dim);background:none;border:none;margin-bottom:18px;transition:color .2s}
.back-btn:hover{color:var(--rosa)}

#login-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;max-width:560px;margin:0 auto;padding:16px 20px 0}
#login-bar img{width:34px;height:34px;border-radius:50%;display:none}
#login-btn{background:var(--rosa);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.06em;font-weight:700}
#login-status{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--text-dim)}
#logout-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:.72rem;color:var(--text-dim);display:none}

@keyframes cpEntra{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cpPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes pdShake{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}100%{transform:translateX(0)}}
@keyframes pdBrilha{0%,100%{opacity:.5}50%{opacity:1}}

.pd-faixa{display:flex;justify-content:center;gap:22px;padding:12px 0 18px}
.pd-faixa span{font-size:1.5rem;opacity:.6;animation:pdBrilha 2.6s ease-in-out infinite}
.pd-faixa span:nth-child(2){animation-delay:.4s}
.pd-faixa span:nth-child(3){animation-delay:.8s}

/* ── NAVEGAÇÃO DE DIAS ── */
.pd-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(196,57,107,.07)}
.pd-nav-btn{background:var(--rosa-dim);border:none;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--rosa);transition:all .15s;flex-shrink:0}
.pd-nav-btn:hover:not(:disabled){background:var(--rosa);color:#fff}
.pd-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.pd-nav-info{text-align:center;flex:1}
.pd-nav-data{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--text)}
.pd-nav-rotulo{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-top:1px}
.pd-nav-hoje{background:none;border:1px solid var(--border);border-radius:20px;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);padding:5px 10px;flex-shrink:0}
.pd-nav-hoje:hover{border-color:var(--rosa);color:var(--rosa)}

/* ── CARTA DO JOGO ── */
.pd-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px 22px;box-shadow:0 8px 28px rgba(196,57,107,.1);animation:cpEntra .3s ease both}
.pd-tentativas{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.pd-tentativa-dot{width:11px;height:11px;border-radius:50%;background:rgba(196,57,107,.15);transition:all .2s}
.pd-tentativa-dot.usada{background:#c0392b}
.pd-tentativa-dot.atual{background:var(--rosa);box-shadow:0 0 0 3px rgba(196,57,107,.2)}

.pd-dicas{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.pd-dica{border-radius:12px;padding:13px 15px;font-family:'Crimson Pro',Georgia,serif;font-size:.92rem;line-height:1.5;position:relative;transition:all .25s}
.pd-dica.liberada{background:var(--rosa-dim);color:var(--text);animation:cpEntra .3s ease both}
.pd-dica.bloqueada{background:rgba(46,26,14,.04);color:transparent;filter:blur(5px);user-select:none;pointer-events:none;min-height:44px}
.pd-dica-num{display:inline-block;font-family:'Cinzel',serif;font-size:.56rem;font-weight:700;letter-spacing:.06em;color:var(--rosa);margin-right:6px}
.pd-dica.bloqueada .pd-dica-num{color:transparent}

.pd-input-row{display:flex;gap:8px;margin-bottom:10px}
.pd-input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);background:var(--rosa-dim);outline:none;text-transform:uppercase;letter-spacing:.03em}
.pd-input:focus{border-color:var(--rosa);background:#fff}
.pd-input.errou{animation:pdShake .4s ease}
.pd-btn-chutar{background:var(--rosa);color:#fff;border:none;border-radius:10px;padding:0 22px;font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.pd-btn-chutar:disabled{opacity:.5;cursor:not-allowed}
.pd-btn-revelar{width:100%;background:none;border:1.5px dashed rgba(196,57,107,.3);border-radius:10px;padding:10px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--rosa);transition:all .15s}
.pd-btn-revelar:hover{background:var(--rosa-dim)}

.pd-erro-msg{text-align:center;font-family:'Crimson Pro',serif;font-size:.85rem;font-style:italic;color:#a5362a;margin-top:8px;min-height:20px}

/* ── RESULTADO ── */
.pd-resultado{text-align:center}
.pd-resultado-icone{font-size:3rem;margin-bottom:8px}
.pd-resultado-titulo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:600;margin-bottom:6px}
.pd-resultado-palavra{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;letter-spacing:.06em;color:var(--rosa);margin:12px 0;padding:14px;background:var(--rosa-dim);border-radius:12px}
.pd-grid-emoji{font-size:1.5rem;letter-spacing:4px;margin:14px 0;text-align:center}
.pd-explicacao{text-align:left;font-family:'Crimson Pro',Georgia,serif;font-size:.9rem;line-height:1.65;color:var(--text);background:var(--rosa-dim);border-radius:12px;padding:16px 18px;margin:16px 0}
.pd-explicacao-titulo{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rosa);font-weight:700;margin-bottom:8px;display:block}
.pd-btn-compartilhar{width:100%;background:linear-gradient(135deg,var(--gold),#c88c00);color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.06em;font-weight:700;margin-top:8px;transition:transform .15s}
.pd-btn-compartilhar:hover{transform:translateY(-2px)}
.pd-copiado{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--green);text-align:center;margin-top:8px;display:none}
.pd-copiado.show{display:block;animation:cpEntra .2s ease both}

.pd-indisponivel{text-align:center;padding:30px 10px;color:var(--text-dim);font-family:'Crimson Pro',serif;font-style:italic}
</style>
</head>

<div id="login-bar">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDZ_vFMHZ7t7nyJWJPRfD280VZzagqY5Ws",
  authDomain: "terreiro-bolhas-de-luz.firebaseapp.com",
  projectId: "terreiro-bolhas-de-luz",
  storageBucket: "terreiro-bolhas-de-luz.firebasestorage.app",
  messagingSenderId: "179602931861",
  appId: "1:179602931861:web:5cf336e9077334cee05b9c",
  measurementId: "G-6Z1WED2GB1"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById('login-btn').addEventListener('click', () => {
  signInWithPopup(auth, provider).catch(e => console.warn('login:', e));
});
document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  const statusEl = document.getElementById('login-status');
  const avatarEl = document.getElementById('login-avatar');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  if (user) {
    statusEl.textContent = user.displayName || user.email;
    avatarEl.src = user.photoURL || '';
    avatarEl.style.display = user.photoURL ? 'block' : 'none';
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
  } else {
    statusEl.textContent = 'Não conectada';
    avatarEl.style.display = 'none';
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
  }
});
// login aqui é só cosmético — o jogo funciona igual pra todo mundo, logada ou não.

// LÓGICA DO JOGO
// ══════════════════════════════════════════════════════════════
const PD_MAX_TENTATIVAS = 5;
const PD_LINK_SITE = 'https://bolhasdeluz.ong.br/palavra.html';

function pdNormalizar(str) {
  return (str || '')
    .toString()
    .trim()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/\s+/g, ' '); // colapsa espaços extras
}

function pdDataHojeStr() {
  const d = new Date();
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function pdFormatarData(dataStr) {
  const [ano, mes, dia] = dataStr.split('-');
  return `${dia}/${mes}`;
}

function pdChaveStorage(dataStr) { return 'jogo-terreiro-' + dataStr; }

function pdCarregarEstado(dataStr) {
  try {
    const raw = localStorage.getItem(pdChaveStorage(dataStr));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function pdSalvarEstado(dataStr, estado) {
  try { localStorage.setItem(pdChaveStorage(dataStr), JSON.stringify(estado)); } catch (e) {}
}

function pdEstadoNovo() {
  return { tentativas: [], dicaAtual: 1, finalizado: false, venceu: null };
}

// datas disponíveis, ordenadas (mais antiga primeiro)
const PD_DATAS_DISPONIVEIS = Object.keys(PALAVRAS_DATA).sort();
const PD_DATA_MAIS_ANTIGA = PD_DATAS_DISPONIVEIS[0];

let pdDataAtual = pdDataHojeStr();
// se por algum motivo a data de hoje ainda não tem palavra cadastrada,
// cai pra data mais recente disponível que não seja futura
if (!PALAVRAS_DATA[pdDataAtual]) {
  const disponiveisAteHoje = PD_DATAS_DISPONIVEIS.filter(d => d <= pdDataAtual);
  pdDataAtual = disponiveisAteHoje.length ? disponiveisAteHoje[disponiveisAteHoje.length - 1] : PD_DATAS_DISPONIVEIS[PD_DATAS_DISPONIVEIS.length - 1];
}

function pdIrPara(dataStr) {
  pdDataAtual = dataStr;
  pdRenderNav();
  pdRenderJogo();
}

function pdNavegar(delta) {
  const d = new Date(pdDataAtual + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  const ano = d.getFullYear(), mes = String(d.getMonth() + 1).padStart(2, '0'), dia = String(d.getDate()).padStart(2, '0');
  const novaData = `${ano}-${mes}-${dia}`;
  const hoje = pdDataHojeStr();
  if (novaData > hoje) return; // PROIBIDO ir pro futuro
  pdIrPara(novaData);
}

function pdRenderNav() {
  const hoje = pdDataHojeStr();
  document.getElementById('pd-nav-data').textContent = pdFormatarData(pdDataAtual);
  const rotuloEl = document.getElementById('pd-nav-rotulo');
  if (pdDataAtual === hoje) rotuloEl.textContent = 'HOJE';
  else {
    const ontem = new Date(hoje + 'T12:00:00'); ontem.setDate(ontem.getDate() - 1);
    const ontemStr = `${ontem.getFullYear()}-${String(ontem.getMonth()+1).padStart(2,'0')}-${String(ontem.getDate()).padStart(2,'0')}`;
    rotuloEl.textContent = pdDataAtual === ontemStr ? 'ONTEM' : 'DIA ANTERIOR';
  }
  document.getElementById('pd-nav-proximo').disabled = (pdDataAtual >= hoje);
  document.getElementById('pd-nav-anterior').disabled = (pdDataAtual <= PD_DATA_MAIS_ANTIGA);
  document.getElementById('pd-nav-hoje').style.display = (pdDataAtual === hoje) ? 'none' : 'inline-block';
}

function pdRenderJogo() {
  const wrap = document.getElementById('pd-conteudo');
  const palavraObj = PALAVRAS_DATA[pdDataAtual];

  if (!palavraObj) {
    wrap.innerHTML = '<div class="pd-card"><div class="pd-indisponivel">🌙 Ainda não tem palavra cadastrada pra esse dia.</div></div>';
    return;
  }

  const estado = pdCarregarEstado(pdDataAtual) || pdEstadoNovo();

  if (estado.finalizado) {
    pdRenderResultado(wrap, palavraObj, estado);
  } else {
    pdRenderAtivo(wrap, palavraObj, estado);
  }
}

function pdRenderAtivo(wrap, palavraObj, estado) {
  const dots = Array.from({ length: PD_MAX_TENTATIVAS }, (_, i) => {
    let cls = 'pd-tentativa-dot';
    if (i < estado.tentativas.length) cls += ' usada';
    else if (i === estado.tentativas.length) cls += ' atual';
    return `<span class="${cls}"></span>`;
  }).join('');

  const dicasHtml = palavraObj.dicas.map((d, i) => {
    const num = i + 1;
    if (num <= estado.dicaAtual) {
      return `<div class="pd-dica liberada"><span class="pd-dica-num">DICA ${num}</span>${d}</div>`;
    }
    return `<div class="pd-dica bloqueada"><span class="pd-dica-num">DICA ${num}</span>${d}</div>`;
  }).join('');

  const tentativasRestantes = PD_MAX_TENTATIVAS - estado.tentativas.length;
  const podeRevelar = estado.dicaAtual < 5;

  wrap.innerHTML = `
    <div class="pd-card">
      <div class="pd-tentativas">${dots}</div>
      <div class="pd-dicas">${dicasHtml}</div>
      <div class="pd-input-row">
        <input type="text" class="pd-input" id="pd-input" placeholder="Sua resposta..." maxlength="30" autocomplete="off">
        <button class="pd-btn-chutar" id="pd-btn-chutar">Chutar</button>
      </div>
      <div class="pd-erro-msg" id="pd-erro-msg"></div>
      ${podeRevelar ? `<button class="pd-btn-revelar" id="pd-btn-revelar">👁 Revelar próxima dica (${tentativasRestantes} tentativa${tentativasRestantes !== 1 ? 's' : ''} restante${tentativasRestantes !== 1 ? 's' : ''})</button>` : ''}
    </div>`;

  const input = document.getElementById('pd-input');
  const btnChutar = document.getElementById('pd-btn-chutar');
  btnChutar.addEventListener('click', () => pdChutar(palavraObj));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') pdChutar(palavraObj); });
  input.focus();

  const btnRevelar = document.getElementById('pd-btn-revelar');
  if (btnRevelar) btnRevelar.addEventListener('click', () => pdRevelarProximaDica(palavraObj));
}

function pdChutar(palavraObj) {
  const input = document.getElementById('pd-input');
  const palpite = input.value.trim();
  if (!palpite) { input.focus(); return; }

  const estado = pdCarregarEstado(pdDataAtual) || pdEstadoNovo();
  const acertou = pdNormalizar(palpite) === pdNormalizar(palavraObj.palavra);

  estado.tentativas.push({ palpite, acertou });

  if (acertou) {
    estado.finalizado = true;
    estado.venceu = true;
  } else {
    input.classList.add('errou');
    setTimeout(() => input.classList.remove('errou'), 400);
    document.getElementById('pd-erro-msg').textContent = 'Não é essa... tenta de novo ✦';
    if (estado.dicaAtual < 5) estado.dicaAtual++;
    if (estado.tentativas.length >= PD_MAX_TENTATIVAS) {
      estado.finalizado = true;
      estado.venceu = false;
    }
  }

  pdSalvarEstado(pdDataAtual, estado);
  pdRenderJogo();
}

function pdRevelarProximaDica(palavraObj) {
  const estado = pdCarregarEstado(pdDataAtual) || pdEstadoNovo();
  if (estado.dicaAtual < 5) estado.dicaAtual++;
  pdSalvarEstado(pdDataAtual, estado);
  pdRenderJogo();
}

function pdRenderResultado(wrap, palavraObj, estado) {
  const venceu = estado.venceu;
  const numDicasUsadas = estado.dicaAtual;
  const icone = venceu ? (numDicasUsadas <= 2 ? '🌟' : numDicasUsadas <= 3 ? '🎉' : '✨') : '🌙';
  const titulo = venceu ? 'Você acertou!' : 'Não foi dessa vez';

  const gridEmoji = venceu
    ? '🟩'.repeat(numDicasUsadas) + '⬛'.repeat(5 - numDicasUsadas)
    : '🟥'.repeat(5);

  wrap.innerHTML = `
    <div class="pd-card pd-resultado">
      <div class="pd-resultado-icone">${icone}</div>
      <div class="pd-resultado-titulo">${titulo}</div>
      <div class="pd-resultado-palavra">${palavraObj.palavra}</div>
      <div class="pd-grid-emoji">${gridEmoji}</div>
      <div class="pd-explicacao">
        <span class="pd-explicacao-titulo">✦ O que significa</span>
        ${palavraObj.explicacao}
      </div>
      <button class="pd-btn-compartilhar" id="pd-btn-compartilhar">📤 Compartilhar resultado</button>
      <div class="pd-copiado" id="pd-copiado">✓ Copiado! Cola no WhatsApp ✦</div>
    </div>`;

  document.getElementById('pd-btn-compartilhar').addEventListener('click', () => pdCompartilhar(gridEmoji));
}

async function pdCompartilhar(gridEmoji) {
  const texto = `🔮 Palavra do Dia no Terreiro (${pdFormatarData(pdDataAtual)})\n${gridEmoji}\nJogue também: ${PD_LINK_SITE}`;
  const aviso = document.getElementById('pd-copiado');
  try {
    if (navigator.share) {
      await navigator.share({ text: texto });
      return;
    }
    await navigator.clipboard.writeText(texto);
    aviso.classList.add('show');
    setTimeout(() => aviso.classList.remove('show'), 2500);
  } catch (e) {
    // usuária cancelou o compartilhamento nativo, ou clipboard falhou — tenta fallback simples
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      aviso.classList.add('show');
      setTimeout(() => aviso.classList.remove('show'), 2500);
    } catch (e2) { console.warn('compartilhar:', e2); }
  }
}

// ── NAVEGAÇÃO ──
document.getElementById('pd-nav-anterior').addEventListener('click', () => pdNavegar(-1));
document.getElementById('pd-nav-proximo').addEventListener('click', () => pdNavegar(1));
document.getElementById('pd-nav-hoje').addEventListener('click', () => pdIrPara(pdDataHojeStr()));

pdRenderNav();
pdRenderJogo();
</script>
