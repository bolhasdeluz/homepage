function log(msg){const el=document.getElementById('log');el.innerHTML+=msg+'\n';el.scrollTop=el.scrollHeight;}
function setStatus(email,status,tipo){const el=document.getElementById('s-'+email.replace(/[@.]/g,'_'));if(el){el.textContent=status;el.className='status '+tipo;}}
document.getElementById('lista').innerHTML=perfis.map(p=>`<div class="card"><div><div class="card-nome">${p.nome} — ${p.cargo}</div><div class="card-email">${p.email}</div></div><span class="status aguard" id="s-${p.email.replace(/[@.]/g,'_')}">aguardando</span></div>`).join('');
async function migrar(){
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Migrando...';
  log('Iniciando migração de '+perfis.length+' perfis...');
  for(const p of perfis){
    try{
      setStatus(p.email,'enviando...','aguard');
      const res=await fetch('/api/perfil',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':'admin','X-User-Email':p.email},body:JSON.stringify({...p,solicitacao:'Migração CSV v2'})});
      const json=await res.json();
      if(json.ok){setStatus(p.email,'✓ ok','ok');log('✓ '+p.nome);}
      else{setStatus(p.email,'✗ erro','erro');log('✗ '+p.nome+': '+JSON.stringify(json));}
    }catch(e){setStatus(p.email,'✗ falha','erro');log('✗ '+p.nome+': '+e.message);}
    await new Promise(r=>setTimeout(r,300));
  }
  log('\n✦ Concluído!');btn.textContent='✓ Pronto';
}
