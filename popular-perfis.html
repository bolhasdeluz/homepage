async function popular() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.innerHTML = '<span class="info">Iniciando...</span>\n';

  for (const p of perfis) {
    const payload = {
      ...p,
      foto: '',
      notas: '',
      solicitacao: 'Perfil pré-populado pelo admin',
      criadoEm: Date.now()
    };
    try {
      const res = await fetch('/api/perfil', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Password': 'admin',
          'X-User-Email': p.email
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.ok) {
        log.innerHTML += `<span class="ok">✓ ${p.nome} (${p.email})</span>\n`;
      } else {
        log.innerHTML += `<span class="err">✕ ${p.nome} — ${JSON.stringify(data)}</span>\n`;
      }
    } catch(e) {
      log.innerHTML += `<span class="err">✕ ${p.nome} — ${e.message}</span>\n`;
    }
    await new Promise(r => setTimeout(r, 200));
  }

  log.innerHTML += '\n<span class="ok">✦ Concluído!</span>';
  btn.disabled = false;
}
