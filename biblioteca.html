<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Digital — Bolhas de Luz</title>
<meta name="description" content="Catálogo dos livros do Terreiro Bolhas de Luz — autor, ano, vertente, dono e com quem o livro está agora.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca — Bolhas de Luz">
<meta name="theme-color" content="#c4396b">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rosa:#c4396b;--rosa-dim:rgba(196,57,107,.08);--rosa-border:rgba(196,57,107,.25);
  --terra:#8c3a1a;
  --creme:#fff5f7;
  --border:rgba(196,90,30,.13);
  --text:#2e1a0e;--text-dim:rgba(46,26,14,.48);
  --verde:#2a7a60;--verde-dim:rgba(42,122,96,.1);
  --ambar:#8c6400;--ambar-dim:rgba(196,160,0,.1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(196,57,107,.1) 0%,rgba(196,57,107,.04) 35%,transparent 65%),
    radial-gradient(ellipse at 15% 90%,rgba(196,57,107,.07) 0%,transparent 50%),
    #fff5f7;}

.section-wrap{max-width:640px;margin:0 auto;padding:40px 24px 80px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:var(--text-dim);background:none;border:none;text-decoration:none;margin-bottom:22px;transition:color .2s}
.back-btn:hover{color:var(--rosa)}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin-bottom:10px;text-align:center}
.section-title{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:var(--text);margin-bottom:6px;text-align:center}
.section-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1.05rem;color:var(--text-dim);font-style:italic;margin-bottom:22px;line-height:1.6;text-align:center}

.busca-wrap{position:relative;margin-bottom:14px}
.busca-input{width:100%;background:#fff;border:1px solid var(--border);border-radius:40px;padding:12px 18px;font-family:'Crimson Pro',serif;font-size:1rem;color:var(--text);outline:none;transition:border-color .2s;box-shadow:0 2px 12px rgba(196,57,107,.06)}
.busca-input:focus{border-color:var(--rosa)}

.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.05em;padding:6px 13px;border-radius:20px;background:#fff;border:1px solid var(--border);color:var(--text-dim);transition:.2s}
.chip:hover{border-color:var(--rosa);color:var(--rosa)}
.chip.ativo{background:var(--rosa);border-color:var(--rosa);color:#fff}

.lv-vazio,.lv-carregando{text-align:center;padding:30px 20px;font-family:'Crimson Pro',serif;font-style:italic;color:var(--text-dim)}

.lv-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.lv-titulo{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:2px}
.lv-autor-ano{font-family:'Crimson Pro',serif;font-size:.88rem;color:var(--text-dim);font-style:italic;margin-bottom:10px}
.lv-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.lv-tag{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.04em;padding:3px 10px;border-radius:20px;background:var(--rosa-dim);border:1px solid var(--rosa-border);color:var(--rosa)}
.lv-dono{font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--text-dim)}
.lv-status{font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;border-radius:8px;padding:6px 10px;display:inline-block}
.lv-status.na-estante{background:var(--verde-dim);color:var(--verde)}
.lv-status.emprestado{background:var(--ambar-dim);color:var(--ambar)}

.saiba-mais{font-family:'Crimson Pro',serif;font-size:.85rem;font-style:italic;color:var(--text-dim);text-align:center;margin-top:30px}
.saiba-mais a{color:var(--rosa);text-decoration:underline}
</style>
</head>
<body>

<div class="section-wrap">
  <a class="back-btn" href="/">← Voltar pro site</a>
  <div class="eyebrow">Terreiro Bolhas de Luz</div>
  <div class="section-title">📚 Biblioteca Digital</div>
  <p class="section-sub">Os livros da nossa casa — de que vertente, quem é o dono, e com quem está agora ✦</p>

  <div class="busca-wrap">
    <input type="text" class="busca-input" id="lv-busca" placeholder="Buscar por título, autor ou dono…" oninput="lvFiltrar()">
  </div>
  <div class="chips-wrap" id="lv-chips"></div>

  <div id="lv-carregando" class="lv-carregando">Carregando biblioteca...</div>
  <div id="lv-vazio" class="lv-vazio" style="display:none">Ainda não tem nenhum livro cadastrado ✦</div>
  <div id="lv-lista"></div>

  <p class="saiba-mais">✦ Quer saber mais sobre a nossa casa? <a href="/">visite o menu do nosso site</a> ✦</p>
</div>

<script>
const LV_API = '/api/biblioteca';
let lvLivros = [];
let lvVertenteAtiva = null;

function lvEsc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function lvCarregar() {
  document.getElementById('lv-carregando').style.display = '';
  document.getElementById('lv-vazio').style.display = 'none';
  document.getElementById('lv-lista').innerHTML = '';
  try {
    const res = await fetch(LV_API);
    const data = res.ok ? await res.json() : null;
    lvLivros = (data && data.livros) || [];
  } catch (e) { lvLivros = []; }
  document.getElementById('lv-carregando').style.display = 'none';

  if (!lvLivros.length) {
    document.getElementById('lv-vazio').style.display = '';
    return;
  }
  lvRenderChips();
  lvRenderLista(lvLivros);
}

function lvRenderChips() {
  const vertentes = [...new Set(lvLivros.map(l => l.vertente).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const el = document.getElementById('lv-chips');
  if (!vertentes.length) { el.innerHTML = ''; return; }
  el.innerHTML = vertentes.map(v => `<button class="chip${v === lvVertenteAtiva ? ' ativo' : ''}" onclick="lvToggleVertente('${v.replace(/'/g, "\\'")}')">${lvEsc(v)}</button>`).join('');
}

function lvToggleVertente(v) {
  lvVertenteAtiva = (lvVertenteAtiva === v) ? null : v;
  lvRenderChips();
  lvFiltrar();
}

function lvFiltrar() {
  const termo = document.getElementById('lv-busca').value.trim().toLowerCase();
  const filtrados = lvLivros.filter(l => {
    if (lvVertenteAtiva && l.vertente !== lvVertenteAtiva) return false;
    if (!termo) return true;
    const alvo = [l.titulo, l.autor, l.dono].join(' ').toLowerCase();
    return alvo.includes(termo);
  });
  lvRenderLista(filtrados);
}

function lvRenderLista(livros) {
  const lista = document.getElementById('lv-lista');
  if (!livros.length) {
    lista.innerHTML = '<div class="lv-vazio">Nenhum livro encontrado ✦</div>';
    return;
  }
  lista.innerHTML = livros.map(lvRenderCard).join('');
}

function lvRenderCard(l) {
  const comQuem = (l.comQuemEsta || '').trim();
  const naEstante = !comQuem || comQuem === l.dono;
  const statusHtml = naEstante
    ? `<span class="lv-status na-estante">📍 Na estante${l.dono ? ' — com ' + lvEsc(l.dono) : ''}</span>`
    : `<span class="lv-status emprestado">📤 Emprestado — está com ${lvEsc(comQuem)}</span>`;
  return `<div class="lv-card">
    <div class="lv-titulo">${lvEsc(l.titulo)}</div>
    <div class="lv-autor-ano">${[lvEsc(l.autor), lvEsc(l.ano)].filter(Boolean).join(' · ')}</div>
    <div class="lv-meta">
      ${l.vertente ? `<span class="lv-tag">${lvEsc(l.vertente)}</span>` : ''}
      ${l.dono ? `<span class="lv-dono">Dono(a): ${lvEsc(l.dono)}</span>` : ''}
    </div>
    ${statusHtml}
  </div>`;
}

lvCarregar();

// contador de acessos diários — só registra, sem bloquear nada se falhar
fetch('/api/visita?pagina=biblioteca', { method: 'POST' }).catch(() => {});
</script>

</body>
</html>
