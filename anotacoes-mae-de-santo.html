<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações da Mãe de Santo — Bolhas de Luz</title>
<meta name="description" content="Anotações e orientações da Mãe de Santo do Terreiro Bolhas de Luz, organizadas em tópicos.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anotações — Bolhas de Luz">
<meta name="theme-color" content="#c4396b">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rosa:#c4396b;--rosa-dim:rgba(196,57,107,.08);--rosa-border:rgba(196,57,107,.25);
  --terra:#8c3a1a;
  --creme:#fff5f7;
  --border:rgba(196,90,30,.13);
  --text:#2e1a0e;--text-dim:rgba(46,26,14,.48);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(196,57,107,.1) 0%,rgba(196,57,107,.04) 35%,transparent 65%),
    radial-gradient(ellipse at 15% 90%,rgba(196,57,107,.07) 0%,transparent 50%),
    #fff5f7;}

.section-wrap{max-width:560px;margin:0 auto;padding:40px 24px 100px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:var(--text-dim);background:none;border:none;text-decoration:none;margin-bottom:22px;transition:color .2s}
.back-btn:hover{color:var(--rosa)}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin-bottom:10px;text-align:center}
.section-title{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:var(--text);margin-bottom:6px;text-align:center}
.section-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1.05rem;color:var(--text-dim);font-style:italic;margin-bottom:22px;line-height:1.6;text-align:center}

.am-vazio,.am-carregando{text-align:center;padding:30px 20px;font-family:'Crimson Pro',serif;font-style:italic;color:var(--text-dim)}

.am-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.am-card-texto{font-family:'Crimson Pro',serif;font-size:.98rem;color:var(--text);line-height:1.65;white-space:pre-wrap;margin-bottom:10px}
.am-card-data{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--text-dim)}

.am-saiba-mais{font-family:'Crimson Pro',serif;font-size:.85rem;font-style:italic;color:var(--text-dim);text-align:center;margin-top:24px}
.am-saiba-mais a{color:var(--rosa);text-decoration:underline}
</style>
</head>
<body>

<div class="section-wrap">
  <a class="back-btn" href="/">← Voltar pro site</a>
  <div class="eyebrow">Terreiro Bolhas de Luz</div>
  <div class="section-title">📖 Anotações da Mãe de Santo</div>
  <p class="section-sub">Orientações e reflexões escritas pela Mãe de Santo, organizadas em tópicos ✦</p>

  <div id="am-carregando" class="am-carregando">Carregando anotações...</div>
  <div id="am-vazio" class="am-vazio" style="display:none">Ainda não tem nenhum tópico escrito aqui ✦</div>
  <div id="am-lista"></div>

  <p class="am-saiba-mais">✦ Quer saber mais sobre a nossa terreira? <a href="/">visite o menu do nosso site</a> ✦</p>
</div>

<script>
const AM_API = '/api/anotacoes-mae-de-santo';

function amFormatarData(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function amEsc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function amCarregar() {
  document.getElementById('am-carregando').style.display = '';
  document.getElementById('am-vazio').style.display = 'none';
  document.getElementById('am-lista').innerHTML = '';
  let topicos = [];
  try {
    const res = await fetch(AM_API);
    const data = res.ok ? await res.json() : null;
    topicos = (data && data.topicos) || [];
  } catch (e) { topicos = []; }
  document.getElementById('am-carregando').style.display = 'none';

  if (!topicos.length) {
    document.getElementById('am-vazio').style.display = '';
    return;
  }
  document.getElementById('am-lista').innerHTML = topicos.map(amRenderCard).join('');
}

function amRenderCard(t) {
  return `<div class="am-card">
    <div class="am-card-texto">${amEsc(t.texto)}</div>
    <span class="am-card-data">${amFormatarData(t.atualizadoEm || t.criadoEm)}</span>
  </div>`;
}

amCarregar();

// contador de acessos diários — só registra, sem bloquear nada se falhar
fetch('/api/visita?pagina=anotacoes-mae-de-santo', { method: 'POST' }).catch(() => {});
</script>

</body>
</html>
