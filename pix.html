<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pix para doações — Bolhas de Luz</title>
<meta name="description" content="Terreiro Bolhas de Luz — Pix para doações.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pix — Bolhas de Luz">
<meta name="theme-color" content="#c4396b">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rosa:#c4396b;--rosa-l:#e8688a;--rosa-dim:rgba(196,57,107,.08);
  --terra:#8c3a1a;
  --creme:#fff5f7;--surface:rgba(255,255,255,.72);
  --border:rgba(196,90,30,.13);
  --text:#2e1a0e;--text-dim:rgba(46,26,14,.48);
  --green:#2a7a60;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(196,57,107,.1) 0%,rgba(196,57,107,.04) 35%,transparent 65%),
    radial-gradient(ellipse at 15% 90%,rgba(196,57,107,.07) 0%,transparent 50%),
    #fff5f7;}

.section-wrap{max-width:720px;margin:0 auto;padding:52px 24px 120px}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin-bottom:10px}
.section-title{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:600;color:var(--text);margin-bottom:8px}
.section-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1rem;color:var(--text-dim);font-style:italic;margin-bottom:36px;line-height:1.6}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:var(--text-dim);background:none;border:none;margin-bottom:28px;transition:color .2s;}
.back-btn:hover{color:var(--rosa)}
</style>
</head>
<body>

<div class="section-wrap">
  <a class="back-btn" href="/">← Voltar</a>
  <div class="eyebrow">Apoie a Terreira</div>
  <div class="section-title">Pix para doações</div>
  <p class="section-sub">Qualquer valor é bem-vindo e será revertido às contas e manutenção da casa.</p>

  <div style="background:linear-gradient(135deg,var(--rosa),#e07a90);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 6px 24px rgba(196,57,107,.25)">
    <div style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:6px">✦ Doe via PIX</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px 14px">
      <div style="min-width:0">
        <div style="font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:2px">Chave PIX (copia e cola)</div>
        <div style="font-family:'Crimson Pro',serif;font-size:1.05rem;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">bolhasdeluz@gmail.com</div>
      </div>
      <button onclick="copiarPix('btn-copiar-pix-doacoes')" id="btn-copiar-pix-doacoes" style="background:#fff;border:none;border-radius:8px;color:var(--rosa);font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.06em;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s">Copiar</button>
    </div>
  </div>

  <p style="font-family:'Crimson Pro',serif;font-size:.85rem;color:var(--text-dim);font-style:italic">A chave é um e-mail — cole no seu banco em "Pix" → "Copia e cola" ou "Chave e-mail".</p>
</div>

<script>
function copiarPix(btnId) {
  btnId = btnId || 'btn-copiar-pix';
  const chave = 'bolhasdeluz@gmail.com';
  navigator.clipboard.writeText(chave).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const textoOriginal = btn.dataset.textoOriginal || btn.textContent;
    btn.dataset.textoOriginal = textoOriginal;
    btn.textContent = '✓ Copiado!';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = textoOriginal; btn.style.background = 'var(--rosa)'; }, 2000);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = chave;
    document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const textoOriginal = btn.dataset.textoOriginal || btn.textContent;
    btn.dataset.textoOriginal = textoOriginal;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = textoOriginal, 2000);
  });
}
</script>

</body>
</html>
