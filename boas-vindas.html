<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha de Boas-Vindas — Bolhas de Luz</title>
<meta name="description" content="Uma trilha com o que é bom saber logo que a gente chega no Terreiro Bolhas de Luz.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boas-Vindas — Bolhas de Luz">
<meta name="theme-color" content="#c4396b">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --rosa:#c4396b;--rosa-dim:rgba(196,57,107,.08);--rosa-border:rgba(196,57,107,.25);
  --terra:#8c3a1a;
  --creme:#fff5f7;
  --border:rgba(196,90,30,.13);
  --text:#2e1a0e;--text-dim:rgba(46,26,14,.48);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(196,57,107,.1) 0%,rgba(196,57,107,.04) 35%,transparent 65%),
    radial-gradient(ellipse at 15% 90%,rgba(196,57,107,.07) 0%,transparent 50%),
    #fff5f7;}

.section-wrap{max-width:480px;margin:0 auto;padding:40px 24px 80px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;color:var(--text-dim);background:none;border:none;text-decoration:none;margin-bottom:22px;transition:color .2s}
.back-btn:hover{color:var(--rosa)}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin-bottom:10px;text-align:center}
.section-title{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:var(--text);margin-bottom:6px;text-align:center}
.section-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1.05rem;color:var(--text-dim);font-style:italic;margin-bottom:22px;line-height:1.6;text-align:center}

/* progresso */
.progresso-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:30px;padding:8px 16px;margin-bottom:18px}
.progresso-barra{flex:1;height:6px;border-radius:4px;background:var(--rosa-dim);overflow:hidden}
.progresso-fill{height:100%;background:linear-gradient(90deg,var(--rosa),var(--terra));border-radius:4px;transition:width .4s ease;width:0%}
.progresso-txt{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.06em;color:var(--text-dim);white-space:nowrap}

/* paradinhas — fileira de bolinhas que também serve pra pular direto */
.dots-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.dots-row::-webkit-scrollbar{display:none}
.dot{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--rosa-border);display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.2s;opacity:.5}
.dot:hover{opacity:.9}
.dot.lida{background:var(--rosa-dim);opacity:.8}
.dot.atual{opacity:1;border-color:var(--rosa);transform:scale(1.18);box-shadow:0 2px 10px rgba(196,57,107,.3)}

/* o card em si */
.card-wrap{position:relative;touch-action:pan-y}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px 24px 26px;min-height:300px;display:flex;flex-direction:column;animation:cardIn .25s ease}
@keyframes cardIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
.card-icon{font-size:2.6rem;text-align:center;margin-bottom:14px}
.card-titulo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:600;color:var(--text);text-align:center;margin-bottom:16px}
.card-texto{font-family:'Crimson Pro',serif;font-size:1rem;line-height:1.75;color:var(--text);flex:1}
.card-links{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.card-link{display:block;background:var(--rosa-dim);border:1px solid var(--rosa-border);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;color:var(--rosa);text-align:center;transition:.2s}
.card-link:hover{background:var(--rosa);color:#fff}

.nav-row{display:flex;gap:10px;margin-top:16px}
.nav-btn{flex:1;padding:14px;border-radius:12px;font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);background:#fff;color:var(--text-dim);transition:.2s}
.nav-btn:hover:not(:disabled){border-color:var(--rosa);color:var(--rosa)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.principal{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.nav-btn.principal:hover{background:var(--terra);border-color:var(--terra);color:#fff}

.saiba-mais{font-family:'Crimson Pro',serif;font-size:.85rem;font-style:italic;color:var(--text-dim);text-align:center;margin-top:30px}
.saiba-mais a{color:var(--rosa);text-decoration:underline}
</style>
</head>
<body>

<div class="section-wrap">
  <a class="back-btn" href="/">← Voltar pro site</a>
  <div class="eyebrow">Terreiro Bolhas de Luz</div>
  <div class="section-title">🌸 Trilha de Boas-Vindas</div>
  <p class="section-sub">O que é bom saber logo que a gente chega ✦</p>

  <div class="progresso-wrap">
    <div class="progresso-barra"><div class="progresso-fill" id="pg-fill"></div></div>
    <span class="progresso-txt" id="pg-txt">0 de 12 lidas</span>
  </div>

  <div class="dots-row" id="dots-row"></div>

  <div class="card-wrap" id="card-wrap">
    <div class="card" id="card">
      <div class="card-icon" id="card-icon"></div>
      <div class="card-titulo" id="card-titulo"></div>
      <div class="card-texto" id="card-texto"></div>
      <div class="card-links" id="card-links" style="display:none"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="btn-anterior" onclick="anterior()">← Anterior</button>
    <button class="nav-btn principal" id="btn-proxima" onclick="proxima()">Próxima →</button>
  </div>

  <p class="saiba-mais">✦ Quer saber mais sobre a nossa casa? <a href="/">visite o menu do nosso site</a> ✦</p>
</div>

<script>
const PARADAS = [
  { id:'intro', icon:'🌸', titulo:'Seja bem-vinda(o)', texto:'Você está começando (ou já começou) uma caminhada — e toda caminhada tem um primeiro passo. Essa trilha reúne o que é bom saber logo que a gente chega na casa: não precisa decorar nada agora, é só ler com calma, no seu tempo. E pode voltar aqui sempre que quiser.' },
  { id:'hierarquia', icon:'🌳', titulo:'Esse é o seu momento', texto:'Todo filho de fé passa por etapas — não existe atalho, e não existe comparação. Se você está chegando agora, esse é o seu momento de criar raízes: observar, aprender, perguntar. Conta com as mais velhas da casa — Vanessa, Thali, Jaque e Márcia — pra te ajudar a entender esse caminho; elas estão aqui exatamente pra isso. O melhor momento sempre vai ser o agora.' },
  { id:'sessao', icon:'🕯️', titulo:'Chegando numa sessão', texto:'Troque de roupa assim que chegar, e já comece a baixar o ritmo — a concentração começa na chegada. Se a sessão já tiver começado: se defuma, passa uma alfazema, vai no cantinho pedir licença, e entra pelos cantos sem atravessar a corrente. No começo, a roupa é jaleco e calça brancos (ou saia branca com calça por baixo) — sem pressa pra comprar mais nada. E o celular fica fora de uso dentro da corrente: sem feed, sem WhatsApp, sem vibrar no bolso.' },
  { id:'conduta', icon:'🤍', titulo:'Respeito é a base', texto:'Aqui dentro, o mínimo de educação é inegociável — com todo mundo, sempre, mesmo com quem você tem menos proximidade. Não se repassa o que foi dito numa consulta, não se interpreta o que o guia falou pra alguém, e não se anda dizendo que fulana "tá com energia pesada" — isso machuca, e não cabe a gente julgar. Fofoca, deboche e comentário por trás não têm espaço na nossa casa.' },
  { id:'materiais', icon:'🧿', titulo:'Seus materiais, sua responsabilidade', texto:'Tudo que é do seu guia leva etiqueta com o nome dele (e o seu também, se tiver repetido na casa). Ao chegar, leva direto pra mesa da cambonagem — ela não vai procurar na tua bolsa. Esqueceu alguma coisa? Avisa antes da sessão começar. E antes de comprar qualquer elemento novo, pergunta — tem fundamento por trás de cada cor e cada material, e só vale o que foi confirmado de verdade na sessão, nunca um sonho ou uma intuição sozinha.' },
  { id:'preceito', icon:'🌿', titulo:'O preceito é pra você', texto:'Na véspera e no dia da sessão, a gente guarda resguardo: cuida do corpo e da energia, sem álcool, sem relação sexual, sem comida pesada ou desconhecida, e com uma boa noite de sono. Antes da sessão, vale um banho de ervas (de descarrego) dos ombros para baixo — ajuda a chegar mais leve. Não é regra por regra — é pelo seu bem-estar e o de quem divide a corrente com você. Sentiu um mal-estar ou uma dor estranha perto da sessão? Pode ser só o corpo se acostumando com a energia — fala com uma das mais velhas.' },
  { id:'financeiro', icon:'💰', titulo:'Sobre a mensalidade', texto:'A mensalidade começa em R$60, ajustada conforme a situação de cada um — é um compromisso com as contas da casa, não um valor fixo e inflexível. Se não conseguir pagar num mês, avisa; contribuir mesmo que com menos já ajuda bastante. E nenhum valor arrecadado fica com a mãe de santo — tudo é tratado com transparência.' },
  { id:'comunicacao', icon:'💬', titulo:'Quando precisar conversar', texto:'Pode trazer suas dúvidas, suas questões de desenvolvimento, qualquer preocupação — mas vem antes de tomar a decisão, não depois dela já tomada. E se precisar trazer algo sobre outra pessoa, traga com cuidado, sem medo: quando algo chega até a mãe de santo, ela resolve. Confia.' },
  { id:'recursos', icon:'📱', titulo:'Onde tirar dúvidas', texto:'Surgiu uma pergunta do dia a dia? O grupo do WhatsApp da casa é o lugar certo pra perguntar — não precisa guardar pra próxima sessão. E o site também tem bastante informação pra consultar sempre que precisar: esse Estatuto, a Palavra do Dia e mais.' },
  { id:'calendario', icon:'📅', titulo:'De olho no calendário', texto:'Dá uma olhada no calendário anual da casa pra saber quando são as próximas sessões, obrigações e eventos — assim você já se programa com antecedência pros próximos meses, sem surpresa de última hora.',
    links: [ { label:'📅 Ver calendário', href:'calendario.html' } ] },
  { id:'oxe', icon:'⚙️', titulo:'Um outro olhar, quando precisa', texto:'O Conselho do Oxé é formado por quem já tem tempo de casa e a confiança da mãe de santo. Ele existe pra garantir mais um olhar — imparcial e justo — em situações que pedem mais do que uma opinião só. A palavra final é sempre da liderança espiritual, mas ouvir várias vozes antes de decidir faz parte de como a gente se conduz aqui.' },
  { id:'fim', icon:'🗺️', titulo:'Quer se aprofundar?', texto:'Essa trilha é só o comecinho. O Estatuto Interno completo tem todos os detalhes, a Palavra do Dia te ensina os termos da Umbanda um de cada vez, e os Textos Históricos trazem estudos acadêmicos sobre Umbanda e Quimbanda pra quem quiser se aprofundar ainda mais. Achou que faltou alguma coisa nessa trilha? Deixa sua sugestão pro Manual de Boas-Vindas. Volte aqui sempre que precisar — a trilha não desaparece.',
    links: [
      { label:'📜 Estatuto Interno completo', href:'regimentointerno.html' },
      { label:'🔮 Palavra do Dia', href:'palavra.html' },
      { label:'📚 Textos Históricos', href:'textos-historicos.html' },
      { label:'💡 Sugestões pro Manual', href:'sugestoes-manual.html' },
    ] },
];

let visitados = {};
try { visitados = JSON.parse(localStorage.getItem('bdl_trilha_boasvindas_lidas') || '{}'); } catch (e) {}
let atual = 0;
try { atual = parseInt(localStorage.getItem('bdl_trilha_boasvindas_pos') || '0', 10) || 0; } catch (e) {}
if (atual < 0 || atual >= PARADAS.length) atual = 0;

function salvar() {
  try {
    localStorage.setItem('bdl_trilha_boasvindas_lidas', JSON.stringify(visitados));
    localStorage.setItem('bdl_trilha_boasvindas_pos', String(atual));
  } catch (e) {}
}

function irPara(i) {
  if (i < 0 || i >= PARADAS.length) return;
  atual = i;
  render();
}
window.irPara = irPara;
function anterior() { irPara(atual - 1); }
window.anterior = anterior;
function proxima() { irPara(atual + 1); }
window.proxima = proxima;

function render() {
  const p = PARADAS[atual];
  visitados[p.id] = true;
  salvar();

  document.getElementById('card-icon').textContent = p.icon;
  document.getElementById('card-titulo').textContent = p.titulo;
  document.getElementById('card-texto').textContent = p.texto;
  const linksEl = document.getElementById('card-links');
  if (p.links && p.links.length) {
    linksEl.style.display = 'flex';
    linksEl.innerHTML = p.links.map(l => `<a class="card-link" href="${l.href}">${l.label}</a>`).join('');
  } else {
    linksEl.style.display = 'none';
    linksEl.innerHTML = '';
  }
  // reanima o card a cada troca, pra dar a sensação de "passar a página"
  const card = document.getElementById('card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  document.getElementById('btn-anterior').disabled = atual === 0;
  document.getElementById('btn-proxima').disabled = atual === PARADAS.length - 1;

  const qtdLidas = Object.keys(visitados).length;
  document.getElementById('pg-txt').textContent = `${qtdLidas} de ${PARADAS.length} lidas`;
  document.getElementById('pg-fill').style.width = (qtdLidas / PARADAS.length * 100) + '%';

  document.getElementById('dots-row').innerHTML = PARADAS.map((pp, i) => {
    const lida = !!visitados[pp.id];
    return `<button class="dot ${i === atual ? 'atual' : ''} ${lida ? 'lida' : ''}" onclick="irPara(${i})" title="${pp.titulo}">${pp.icon}</button>`;
  }).join('');
  const dotAtual = document.querySelector('.dot.atual');
  if (dotAtual) dotAtual.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// arrasta/desliza o card pros lados pra passar de parada, como num carrossel
let touchX = null, touchY = null;
const cardWrap = document.getElementById('card-wrap');
cardWrap.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });
cardWrap.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) proxima(); else anterior();
  }
  touchX = null; touchY = null;
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') proxima();
  if (e.key === 'ArrowLeft') anterior();
});

render();

// contador de acessos diários — só registra, sem bloquear nada se falhar
fetch('/api/visita?pagina=boas-vindas', { method: 'POST' }).catch(() => {});
</script>

</body>
</html>
